<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>归档说明｜Think OS 插件文档系统</title>
  <link rel="stylesheet" href="../_资源/文档样式.css">
</head>
<body data-doc-root="../">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">Think OS 插件文档系统</div>
        <div class="brand-subtitle">HTML 项目驾驶舱 / 文档 / 需求 / 技术 / 评审 / 发布</div>
      </div>
      <div class="search-box">
        <input class="search-input" data-doc-search placeholder="搜索：需求、命令、设置、文件地图、评审...">
        <div class="search-results" data-search-results></div>
      </div>

    </aside>
    <main class="main">
      <section class="hero">
        <div class="eyebrow">THINK OS DOCUMENT SYSTEM</div>
        <h1>归档说明</h1>
        <p class="lead">这里用于放置从旧 docs/html 迁移或废弃的资料说明。</p>
        <div class="meta-row">
          <span class="badge good">状态：建议模板</span>
          <span class="badge">最后更新：2026-05-07</span>
          <span class="badge">格式：HTML</span>
        </div>
      </section>
      <section class="grid">
<article class="card full"><h2>归档规则</h2><ul><li>旧资料先不要直接删除。</li><li>仍然有效的内容迁移到对应主题。</li><li>过期但有历史价值的资料放到 _归档。</li><li>无价值的临时草稿可以删除，但要先确认没有未迁移信息。</li></ul></article>
</section>
      <footer class="footer">本页属于 Think OS 插件 HTML 文档系统。UI 沿用原有风格，内容可持续补充。</footer>
    </main>
  </div>
  <script src="../_资源/搜索索引.js"></script>
  <script src="../_资源/文档脚本.js"></script>
</body>
</html>
