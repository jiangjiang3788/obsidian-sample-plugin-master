name: Think OS Test System v9

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

jobs:
  strict-ci:
    name: 严格 CI 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            reports/testing
            .cache
          key: think-os-test-history-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            think-os-test-history-${{ runner.os }}-
      - run: npm ci --silent
      - run: npm run 验证:CI:v9
      - name: 发布质量报告
        if: always()
        run: node scripts/testing/generate-quality-report.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-ci-quality
          path: reports/testing/
          if-no-files-found: ignore

  obsidian-p0:
    name: P0 真机
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --silent
      - run: xvfb-run -a npm run 测试:真机:P0

  obsidian-extended:
    name: P1 / P2 / 大仓库 / 兼容矩阵
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --silent
      - run: xvfb-run -a npm run 测试:真机:P1
      - run: xvfb-run -a npm run 测试:真机:P2
      - run: xvfb-run -a npm run 测试:真机:大仓库
      - run: npm run 测试:真机:兼容矩阵
      - run: npm run 测试:稳定性
      - run: xvfb-run -a npm run 测试:真机:稳定性:P0
      - name: 发布质量报告
        if: always()
        run: node scripts/testing/generate-quality-report.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-quality
          path: reports/testing/
          if-no-files-found: ignore
