name: Think OS CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: think-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify and build (no remote publishing)
        run: npm run ci
      - name: Archive Obsidian runtime files
        uses: actions/upload-artifact@v4
        with:
          name: think-os-${{ github.sha }}
          path: |
            main.js
            styles.css
            manifest.json
          if-no-files-found: error
          retention-days: 14
